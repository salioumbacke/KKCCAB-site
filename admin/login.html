
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Administration | KKCCAB</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f0f5f1;
      color: #183b2b;
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      padding: 35px 30px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 36px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin: 0 0 10px;
    }

    .subtitle {
      text-align: center;
      color: #647568;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d6e1d9;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #16834a;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #08783c;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #065f30;
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    #message {
      min-height: 20px;
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      color: #b42318;
    }

    .back {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #08783c;
      font-size: 14px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logo">🌿</div>
    <h1>Administration KKCCAB</h1>
    <p class="subtitle">Connecte-toi à ton espace d'administration.</p>

    <form id="loginForm">
      <label for="email">Adresse e-mail</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        placeholder="ton@email.com"
        required
      >

      <label for="motDePasse">Mot de passe</label>
      <input
        id="motDePasse"
        name="motDePasse"
        type="password"
        autocomplete="current-password"
        placeholder="Ton mot de passe"
        required
      >

      <button id="submitBtn" type="submit">Se connecter</button>
      <p id="message" role="status"></p>
    </form>

    <a class="back" href="/">← Retour au site</a>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitBtn");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      message.textContent = "";
      button.disabled = true;
      button.textContent = "Connexion...";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "same-origin",
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            motDePasse: document.getElementById("motDePasse").value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.erreur || "Connexion impossible.");
        }

        window.location.href = "/admin";
      } catch (error) {
        message.textContent =
          error.message || "Impossible de contacter le serveur.";
      } finally {
        button.disabled = false;
        button.textContent = "Se connecter";
      }
    });
  </script>
</body>
</html>
